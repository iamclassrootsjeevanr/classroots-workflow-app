name: Branch flow

# Code moves feature → development → staging → main. Allowed pull requests:
#   development ← any branch
#   staging     ← development, main (back-merge after a hotfix), hotfix/*
#   main        ← staging, hotfix/*
# Runs on every pull request (also when its target branch is changed) so the result always matches the current target.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

jobs:
  branch-flow:
    name: branch-flow
    runs-on: ubuntu-latest
    steps:
      - name: Check source branch
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
        run: |
          case "$BASE:$HEAD" in
            staging:development|staging:main|staging:hotfix/*|main:staging|main:hotfix/*)
              echo "OK: $HEAD → $BASE" ;;
            staging:*|main:*)
              echo "::error::$HEAD can't merge into $BASE. Flow: feature → development → staging → main (urgent fixes: hotfix/* → main, then main → staging and development)."
              exit 1 ;;
            *)
              echo "OK: $HEAD → $BASE (no restriction)" ;;
          esac
